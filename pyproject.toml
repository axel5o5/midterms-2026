[project]
name = "midterms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Axel Browne" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "html5lib>=1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "mistune>=3.4.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "websockets>=17.4",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
]
